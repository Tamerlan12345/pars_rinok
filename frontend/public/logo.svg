<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none" role="img" aria-label="Centras Tokenizer">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- C-shape node network -->
  <!-- Connector lines -->
  <line x1="22" y1="9" x2="36" y2="9" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="14" y1="9" x2="14" y2="55" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="22" y1="55" x2="36" y2="55" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="14" y1="9" x2="22" y2="9" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="14" y1="55" x2="22" y2="55" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.6"/>
  <!-- Diagonal accent lines -->
  <line x1="14" y1="32" x2="8" y2="32" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
  <line x1="8" y1="20" x2="14" y2="9" stroke="url(#logoGrad)" stroke-width="1" opacity="0.3"/>
  <line x1="8" y1="44" x2="14" y2="55" stroke="url(#logoGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Top-left corner node -->
  <circle cx="14" cy="9" r="5" fill="url(#logoGrad)" filter="url(#glow)"/>
  <circle cx="14" cy="9" r="2.5" fill="#f0f4ff" opacity="0.9"/>

  <!-- Top-right node -->
  <circle cx="36" cy="9" r="4" fill="url(#logoGrad)" filter="url(#glow)" opacity="0.85"/>
  <circle cx="36" cy="9" r="2" fill="#c7d2fe" opacity="0.8"/>

  <!-- Middle accent node (inner bar of C) -->
  <circle cx="8" cy="32" r="3.5" fill="#06b6d4" filter="url(#strongGlow)"/>
  <circle cx="8" cy="32" r="1.5" fill="#cffafe" opacity="0.9"/>

  <!-- Left spine node -->
  <circle cx="14" cy="32" r="4.5" fill="url(#logoGrad)" filter="url(#glow)"/>
  <circle cx="14" cy="32" r="2" fill="#a5b4fc" opacity="0.9"/>

  <!-- Bottom-left corner node -->
  <circle cx="14" cy="55" r="5" fill="url(#logoGrad)" filter="url(#glow)"/>
  <circle cx="14" cy="55" r="2.5" fill="#f0f4ff" opacity="0.9"/>

  <!-- Bottom-right node -->
  <circle cx="36" cy="55" r="4" fill="url(#logoGrad)" filter="url(#glow)" opacity="0.85"/>
  <circle cx="36" cy="55" r="2" fill="#c7d2fe" opacity="0.8"/>

  <!-- Small token dots along spine -->
  <circle cx="14" cy="20" r="2" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="14" cy="44" r="2" fill="#8b5cf6" opacity="0.7"/>

  <!-- Text: centras -->
  <text
    x="52"
    y="33"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="-0.5"
    fill="url(#textGrad)"
    filter="url(#glow)"
  >centras</text>

  <!-- Text: tokenizer -->
  <text
    x="53"
    y="50"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    font-weight="400"
    letter-spacing="3"
    fill="#06b6d4"
    opacity="0.85"
  >TOKENIZER</text>

  <!-- Decorative grid dots (token visualization hint) -->
  <circle cx="230" cy="18" r="1.2" fill="#6366f1" opacity="0.4"/>
  <circle cx="237" cy="18" r="1.2" fill="#6366f1" opacity="0.4"/>
  <circle cx="244" cy="18" r="1.2" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="251" cy="18" r="1.2" fill="#06b6d4" opacity="0.4"/>
  <circle cx="230" cy="25" r="1.2" fill="#6366f1" opacity="0.3"/>
  <circle cx="237" cy="25" r="1.2" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="244" cy="25" r="1.2" fill="#06b6d4" opacity="0.4"/>
  <circle cx="251" cy="25" r="1.2" fill="#06b6d4" opacity="0.3"/>
</svg>

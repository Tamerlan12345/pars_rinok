[pytest]
# Run from the backend/ directory so that `app` is importable without install.
testpaths = tests
asyncio_mode = auto
# Show short summary of failures; -v for verbose output.
addopts = -v --tb=short
# Suppress deprecation noise from third-party libraries.
filterwarnings =
    ignore::DeprecationWarning:jose
    ignore::DeprecationWarning:passlib
    ignore::PendingDeprecationWarning
